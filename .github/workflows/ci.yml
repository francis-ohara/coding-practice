name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint with ruff
        uses: astral-sh/ruff-action@v3
        with:
          src: python
      - name: Check formatting with ruff
        uses: astral-sh/ruff-action@v3
        with:
          src: python
          args: format --check

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run tests
        run: uv run pytest

  index-up-to-date:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Regenerate solutions index
        run: uv run python coding-problems/generate_index.py
      - name: Fail if index is stale
        run: git diff --exit-code coding-problems/README.md
